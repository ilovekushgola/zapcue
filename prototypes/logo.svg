<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Doodle / Hand-drawn YouTube Play Button Logo -->
  <g transform="translate(10, 10)">
    <!-- Main Red Hand-Drawn Rounded Body -->
    <path d="M 120 120 
             C 170 115, 310 112, 360 120 
             C 410 128, 435 160, 440 240 
             C 445 320, 420 355, 360 365 
             C 300 375, 180 375, 120 365 
             C 60 355, 35 320, 40 240 
             C 45 160, 70 125, 120 120 Z" 
          fill="#ff0000" 
          stroke="#000000" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Organic Hand-Drawn Outer Line Shake (double line accent on top) -->
    <path d="M 235 116 C 265 114, 295 114, 320 118" 
          stroke="#000000" 
          stroke-width="7" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- White Highlights on Left and Top-Left -->
    <path d="M 105 136 C 88 152, 75 178, 72 195" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M 68 215 C 67 240, 68 260, 70 275" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M 66 288 C 66 298, 68 312, 72 324" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- White Highlights on Right Edge -->
    <path d="M 408 200 C 418 220, 420 240, 418 250" 
          stroke="#ffffff" 
          stroke-width="9" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M 416 265 C 417 280, 417 295, 414 315" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M 408 330 C 395 352, 375 368, 355 378" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Center Play Triangle (Doodle Style) -->
    <polygon points="195,190 310,250 195,310" 
             fill="#ffffff" 
             stroke="#000000" 
             stroke-width="14" 
             stroke-linejoin="round" 
             stroke-linecap="round"/>

    <!-- Sketchy hand-drawn accent lines around triangle -->
    <path d="M 183 194 C 176 230, 178 280, 185 306" 
          stroke="#000000" 
          stroke-width="7" 
          stroke-linecap="round" 
          fill="none"/>

    <path d="M 292 228 C 308 238, 320 246, 325 258 C 315 272, 298 284, 280 294" 
          stroke="#000000" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"/>

    <path d="M 205 208 L 205 285" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          fill="none"/>
  </g>
</svg>
