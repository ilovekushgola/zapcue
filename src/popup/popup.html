<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapcue</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" width="28" height="28" alt="Zapcue Mascot" style="display:block;">
        <span class="title">Zapcue</span>
      </div>
      <span class="version">v1.0.0</span>
    </div>

    <div class="setting-group">
      <div class="setting-item">
        <div class="setting-info">
          <label for="auto-extract-toggle">Auto Extract</label>
          <span class="desc">Automatically extract upon opening videos</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="auto-extract-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <label for="lang-select">Preferred Language</label>
          <span class="desc">Priority for transcript tracks</span>
        </div>
        <select id="lang-select" class="dropdown">
          <option value="en">English (en)</option>
          <option value="hi">Hindi (hi)</option>
          <option value="es">Spanish (es)</option>
          <option value="fr">French (fr)</option>
          <option value="de">German (de)</option>
          <option value="ja">Japanese (ja)</option>
        </select>
      </div>
    </div>

    <div class="status-box">
      <span class="status-indicator"></span>
      <span id="status-text">Active on YouTube tabs</span>
    </div>

    <div class="footer">
      <span>Zapcue Engine • DOM & Captions</span>
    </div>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
